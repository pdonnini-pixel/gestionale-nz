name: Pixel check (smoke UI)

# Verifica pixel sul SITO DEPLOYATO dei 3 tenant.
# Gira: dopo ogni push su main (post-deploy), ogni giorno, e a mano.
# Richiede i secret di repo: TEST_USER_EMAIL, TEST_USER_PASSWORD
# (stesso utente di test presente su tutti e 3 i tenant).

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *' # ogni giorno alle 06:00 UTC
  workflow_dispatch:

# Se arriva un push nuovo mentre la verifica gira, quella in corso si annulla:
# aspetterebbe un commit che il sito non servira' mai piu'.
concurrency:
  group: pixel-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pixel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tenant: NZ
            url: https://gestionale-nz.netlify.app
          - tenant: Made
            url: https://made-gestionale-nz.netlify.app
          - tenant: Zago
            url: https://zago-gestionale-nz.netlify.app
    name: pixel-${{ matrix.tenant }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Attendi che il site serva QUESTO commit
        # Aspettare un HTTP 200 non bastava: anche la versione precedente
        # risponde 200, quindi il controllo poteva girare sul sito vecchio e
        # dire verde su codice che non era quello appena pubblicato. Ora si
        # aspetta il commit vero, scritto in index.html dal build (vite.config,
        # meta app-commit), e l'attesa ha un senso: e' il deploy di Netlify.
        env:
          ATTESO: ${{ github.sha }}
        run: |
          echo "Attendo che ${{ matrix.url }} serva $ATTESO ..."
          servito=""
          for i in $(seq 1 40); do
            html=$(curl -s --max-time 20 "${{ matrix.url }}/?cache-bust=$RANDOM") || true
            servito=$(printf '%s' "$html" \
              | grep -o 'name="app-commit" content="[^"]*"' \
              | head -1 | sed 's/.*content="//;s/"$//')
            if [ "$servito" = "$ATTESO" ]; then
              echo "Il site serve il commit atteso dopo $i tentativi."
              exit 0
            fi
            echo "tentativo $i: servito='${servito:-nessun marker}' — attendo 15s"
            sleep 15
          done
          echo ""
          echo "Il site non ha servito $ATTESO entro 10 minuti."
          echo "Ultimo commit visto: '${servito:-nessun marker in index.html}'."
          echo "Probabile causa: il deploy Netlify di questo tenant e' fallito o non e' partito."
          exit 1

      - name: Installa Playwright
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Esegui pixel check
        working-directory: tests/e2e
        env:
          BASE_URL: ${{ matrix.url }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: npm test

      - name: Carica il report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-report-${{ matrix.tenant }}
          path: tests/e2e/playwright-report
          retention-days: 7
